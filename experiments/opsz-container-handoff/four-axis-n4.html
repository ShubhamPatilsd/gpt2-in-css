<!doctype html><meta charset="utf-8"><title>four inherited font-axis handoffs</title>
<style>@font-face{font-family:OpszSource;src:url("source.woff2") format("woff2")}
@font-face{font-family:OpszConsumer;src:url("consumer.woff2") format("woff2")}
html,body{margin:0}
body{font:14px system-ui}
input{position:fixed;left:-10000px}
.source{display:inline-block;width:max-content;white-space:pre;font-family:OpszSource;
  font-size:100px;line-height:1;font-kerning:none}
.bridge{position:absolute;container-type:inline-size;height:1px}
.sink{display:inline-block;width:max-content;white-space:pre;font-family:OpszConsumer;
  font-size:100cqi;line-height:1;font-kerning:none}
.mode-none .sink{font-optical-sizing:none}
.mode-auto .sink{font-optical-sizing:auto}
.mode-explicit .sink{font-optical-sizing:none;
  font-variation-settings:"opsz" clamp(60,calc(100cqi / 1px),100)}
body:has(#case-0:checked) .source{font-variation-settings:"X000" 0.0}body:has(#case-1:checked) .source{font-variation-settings:"X000" 0.25}body:has(#case-2:checked) .source{font-variation-settings:"X000" 0.75}body:has(#case-3:checked) .source{font-variation-settings:"X000" 1.0}

@font-face{font-family:FourAxisConsumer;src:url("four-axis.woff2") format("woff2")}
body:has(#four-case-0:checked){--x0:0.1;--x1:0.25;--x2:0.4;--x3:0.55}body:has(#four-case-1:checked){--x0:0.7;--x1:0.55;--x2:0.4;--x3:0.25}
.four-root{position:fixed;left:0;top:-20000px}
.four-group{position:relative;display:block;width:1px;height:1px}
.four-level{position:relative;display:block;width:1px;height:1px}
.four-source{position:absolute;left:0;top:0;font-variation-settings:"X000" var(--x)}
.capture{position:absolute;left:0;top:0;container-type:inline-size;height:1px}
.setter{display:block;width:1px;height:1px}
.setter-wght{font-weight:calc(400 + (100cqi / 1px - 60) * 12.5)}
.setter-wdth{font-stretch:calc((100 + (100cqi / 1px - 60) * 2.5) * 1%)}
.setter-slnt{font-variation-settings:"slnt" calc((100cqi / 1px - 100) * .5)}
.setter-opsz{font-size:100cqi}
.four-sink{display:inline-block;width:max-content;white-space:pre;font-family:FourAxisConsumer;
  font-size:inherit;line-height:1;font-optical-sizing:auto;font-kerning:none}

er setter-slnt"><i class="four-level"><i class="source four-source" style="--x:clamp(0,calc(var(--x3) + 0.0633333333),1);anchor-name:--f1-3">&#xE000;</i><i class="capture" style="position-anchor:--f1-3;width:anchor-size(--f1-3 width)"><i class="setter setter-opsz"><i class="four-sink" data-group="1">&#xE200;</i></i></i></i></i></i></i></i></i></i></i></i></i></span><span class="four-group"><i class="four-level"><i class="source four-source" style="--x:clamp(0,calc(var(--x0) + 0.126666667),1);anchor-name:--f2-0">&#xE000;</i><i class="capture" style="position-anchor:--f2-0;width:anchor-size(--f2-0 width)"><i class="setter setter-wght"><i class="four-level"><i class="source four-source" style="--x:clamp(0,calc(var(--x1) + 0.126666667),1);anchor-name:--f2-1">&#xE000;</i><i class="capture" style="position-anchor:--f2-1;width:anchor-size(--f2-1 width)"><i class="setter setter-wdth"><i class="four-level"><i class="source four-source" style="--x:clamp(0,calc(var(--x2) + 0.126666667),1);anchor-name:--f2-2">&#xE000;</i><i class="capture" style="position-anchor:--f2-2;width:anchor-size(--f2-2 width)"><i class="setter setter-slnt"><i class="four-level"><i class="source four-source" style="--x:clamp(0,calc(var(--x3) + 0.126666667),1);anchor-name:--f2-3">&#xE000;</i><i class="capture" style="position-anchor:--f2-3;width:anchor-size(--f2-3 width)"><i class="setter setter-opsz"><i class="four-sink" data-group="2">&#xE200;</i></i></i></i></i></i></i></i></i></i></i></i></i></span><span class="four-group"><i class="four-level"><i class="source four-source" style="--x:clamp(0,calc(var(--x0) + 0.19),1);anchor-name:--f3-0">&#xE000;</i><i class="capture" style="position-anchor:--f3-0;width:anchor-size(--f3-0 width)"><i class="setter setter-wght"><i class="four-level"><i class="source four-source" style="--x:clamp(0,calc(var(--x1) + 0.19),1);anchor-name:--f3-1">&#xE000;</i><i class="capture" style="position-anchor:--f3-1;width:anchor-size(--f3-1 width)"><i class="setter setter-wdth"><i class="four-level"><i class="source four-source" style="--x:clamp(0,calc(var(--x2) + 0.19),1);anchor-name:--f3-2">&#xE000;</i><i class="capture" style="position-anchor:--f3-2;width:anchor-size(--f3-2 width)"><i class="setter setter-slnt"><i class="four-level"><i class="source four-source" style="--x:clamp(0,calc(var(--x3) + 0.19),1);anchor-name:--f3-3">&#xE000;</i><i class="capture" style="position-anchor:--f3-3;width:anchor-size(--f3-3 width)"><i class="setter setter-opsz"><i class="four-sink" data-group="3">&#xE200;</i></i></i></i></i></i></i></i></i></i></i></i></i></span></main>

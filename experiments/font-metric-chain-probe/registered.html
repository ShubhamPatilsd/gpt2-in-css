<!doctype html><meta charset="utf-8"><title>registered metric chain</title><style>@font-face{font-family:Producer;src:url("producer.ttf")}
@font-face{font-family:Consumer;src:url("consumer.ttf")}
@property --m0{syntax:"<number>";inherits:true;initial-value:-999}@property --m1{syntax:"<number>";inherits:true;initial-value:-999}@property --m2{syntax:"<number>";inherits:true;initial-value:-999}@property --m3{syntax:"<number>";inherits:true;initial-value:-999}@property --m4{syntax:"<number>";inherits:true;initial-value:-999}@property --z{syntax:"<number>";inherits:true;initial-value:-999}
.root{--x0:-.75;--x1:.25;--x2:.5;--x3:-.4;--x4:.8}
.producer{font-family:Producer;font-size:256px;line-height:normal;

.consumer{font-family:Consumer;font-size:256px;line-height:normal}

<!doctype html><meta charset="utf-8"><title>timeline counter matrix 4</title>
<style>
@font-face{font-family:CounterWidth;src:url("counter-width.woff2") format("woff2")}
@counter-style binary-width{system:additive;
additive-symbols:16384 "\e30e",8192 "\e30d",4096 "\e30c",2048 "\e30b",1024 "\e30a",512 "\e309",256 "\e308",128 "\e307",64 "\e306",32 "\e305",16 "\e304",8 "\e303",4 "\e302",2 "\e301",1 "\e300";fallback:decimal}
@property --p0{syntax:"<number>";inherits:false;initial-value:.5}@keyframes tk0{from{--p0:0}to{--p0:1}}.ts0{view-timeline:--t0 inline}.ti0{animation:tk0 1s linear both;animation-timeline:--t0;animation-range:cover;counter-increment:y0 calc((round(nearest,100 / var(--p0) - 101,1)) * -3) y1 calc((round(nearest,100 / var(--p0) - 101,1)) * 2) y2 calc((round(nearest,100 / var(--p0) - 101,1)) * -3) y3 calc((round(nearest,100 / var(--p0) - 101,1)) * -2)}@property --p1{syntax:"<number>";inherits:false;initial-value:.5}@keyframes tk1{from{--p1:0}to{--p1:1}}.ts1{view-timeline:--t1 inline}.ti1{animation:tk1 1s linear both;animation-timeline:--t1;animation-range:cover;counter-increment:y1 calc((round(nearest,100 / var(--p1) - 101,1)) * -3) y2 calc((round(nearest,100 / var(--p1) - 101,1)) * -2) y3 calc((round(nearest,100 / var(--p1) - 101,1)) * 1)}@property --p2{syntax:"<number>";inherits:false;initial-value:.5}@keyframes tk2{from{--p2:0}to{--p2:1}}.ts2{view-timeline:--t2 inline}.ti2{animation:tk2 1s linear both;animation-timeline:--t2;animation-range:cover;counter-increment:y0 calc((round(nearest,100 / var(--p2) - 101,1)) * 3) y1 calc((round(nearest,100 / var(--p2) - 101,1)) * -2) y2 calc((round(nearest,100 / var(--p2) - 101,1)) * -2) y3 calc((round(nearest,100 / var(--p2) - 101,1)) * 2)}@property --p3{syntax:"<number>";inherits:false;initial-value:.5}@keyframes tk3{from{--p3:0}to{--p3:1}}.ts3{view-timeline:--t3 inline}.ti3{animation:tk3 1s linear both;animation-timeline:--t3;animation-range:cover;counter-increment:y0 calc((round(nearest,100 / var(--p3) - 101,1)) * 1) y1 calc((round(nearest,100 / var(--p3) - 101,1)) * -2) y2 calc((round(nearest,100 / var(--p3) - 101,1)) * -1) y3 calc((round(nearest,100 / var(--p3) - 101,1)) * 1)}
html,body{margin:0}
input{position:fixed;left:-10000px}
.matrix{position:relative;counter-reset:y0 1028 y1 1076 y2 1164 y3 1014;timeline-scope:--t0,--t1,--t2,--t3}
.scroller{position:fixed;left:0;top:-20000px;width:100px;height:1px;overflow-x:scroll}
.track{position:relative;width:200px;height:1px}
.timeline-subject{position:absolute;left:0;top:0;display:block;height:1px}
.timeline-increment{position:absolute;left:0;top:0;width:1px;height:1px}
.result{position:absolute;left:0;top:0;display:inline-block;width:max-content;
  white-space:pre;font-family:CounterWidth;font-size:10px;line-height:1;
  font-kerning:none;letter-spacing:0}
body:has(#case-0:checked) .ts0{width:24px}body:has(#case-0:checked) .ts1{width:5px}body:has(#case-0:checked) .ts2{width:14px}body:has(#case-0:checked) .ts3{width:3px}body:has(#case-1:checked) .ts0{width:27px}body:has(#case-1:checked) .ts1{width:17px}body:has(#case-1:checked) .ts2{width:15px}body:has(#case-1:checked) .ts3{width:27px}
.r0::before{content:counter(y0,binary-width)}.r1::before{content:counter(y1,binary-width)}.r2::before{content:counter(y2,binary-width)}.r3::before{content:counter(y3,binary-width)}
</style>
<input id="case-0" name="case" type="radio" checked>
<input id="case-1" name="case" type="radio">
<main class="matrix" data-size="4">
<div class="scroller"><div class="track"><i class="timeline-subject ts0"></i><i class="timeline-subject ts1"></i><i class="timeline-subject ts2"></i><i class="timeline-subject ts3"></i></div></div>
<i class="timeline-increment ti0"></i><i class="timeline-increment ti1"></i><i class="timeline-increment ti2"></i><i class="timeline-increment ti3"></i><i class="result r0" data-output="0"></i><i class="result r1" data-output="1"></i><i class="result r2" data-output="2"></i><i class="result r3" data-output="3"></i>
</main>

<!doctype html>
<meta charset="utf-8">
<title>Direct container-unit numeric readback probe</title>
<style>
  @property --raw {
    syntax: "<number>";
    inherits: true;
    initial-value: -999;
  }
  .metric {
    position: fixed;
    width: 37px;
    height: 10px;
    container-type: inline-size;
  }
  .consumer {
    --raw: calc(100cqi / 1px);
    display: block;
    width: calc(var(--raw) * 1px);
    height: 1px;
    font-variation-settings: "wght" var(--raw);
  }
</style>
<div class="metric"><output id="result" class="consumer"></output></div>

<!doctype html>
<meta charset="utf-8">
<title>Feature-selected ch/ic HVAR pairs</title>
<style>
@font-face{font-family:FeatureMetricPair;src:url("feature-metric-pair.ttf") format("truetype")}
@font-face{font-family:FeatureMetricPair0;src:url("feature-metric-pair.ttf") format("truetype");font-feature-settings:"cv01" 1}@font-face{font-family:FeatureMetricPair1;src:url("feature-metric-pair.ttf") format("truetype");font-feature-settings:"cv01" 2}@font-face{font-family:FeatureMetricPair2;src:url("feature-metric-pair.ttf") format("truetype");font-feature-settings:"cv01" 3}@font-face{font-family:FeatureMetricPair3;src:url("feature-metric-pair.ttf") format("truetype");font-feature-settings:"cv01" 4}@font-face{font-family:FeatureMetricPair4;src:url("feature-metric-pair.ttf") format("truetype");font-feature-settings:"cv01" 5}@font-face{font-family:FeatureMetricPair5;src:url("feature-metric-pair.ttf") format("truetype");font-feature-settings:"cv01" 6}@font-face{font-family:FeatureMetricPair6;src:url("feature-metric-pair.ttf") format("truetype");font-feature-settings:"cv01" 7}@font-face{font-family:FeatureMetricPair7;src:url("feature-metric-pair.ttf") format("truetype");font-feature-settings:"cv01" 8}
.producer{font-family:FeatureMetricPair;font-size:256px;font-variation-settings:"X000" -0.75,"X001" -0.5,"X002" 0,"X003" 1,"X004" 0.75,"X005" -0.25,"X006" 1,"X007" 1}
.pair{position:fixed;display:block;width:1ch;height:1ic}
.glyph-check{position:fixed;display:inline-block;white-space:nowrap}
.face-pair{position:fixed;display:block;width:1ch;height:1ic}
.dynamic-check{position:fixed;display:inline-block;white-space:nowrap}
#dynamic-var{--choice:1;font-feature-settings:"cv01" var(--choice)}
#dynamic-round{--choice-number:1.2;font-feature-settings:"cv01" calc(round(nearest,var(--choice-number),1))}
</style>
<div class="producer"><i class="pair pair-0" style="font-feature-settings:'cv01' 1"></i><i class="pair pair-1" style="font-feature-settings:'cv01' 2"></i><i class="pair pair-2" style="font-feature-settings:'cv01' 3"></i><i class="pair pair-3" style="font-feature-settings:'cv01' 4"></i><i class="pair pair-4" style="font-feature-settings:'cv01' 5"></i><i class="pair pair-5" style="font-feature-settings:'cv01' 6"></i><i class="pair pair-6" style="font-feature-settings:'cv01' 7"></i><i class="pair pair-7" style="font-feature-settings:'cv01' 8"></i><span class="glyph-check glyph-check-0" style="font-feature-settings:'cv01' 1">0水</span><span class="glyph-check glyph-check-1" style="font-feature-settings:'cv01' 2">0水</span><span class="glyph-check glyph-check-2" style="font-feature-settings:'cv01' 3">0水</span><span class="glyph-check glyph-check-3" style="font-feature-settings:'cv01' 4">0水</span><span class="glyph-check glyph-check-4" style="font-feature-settings:'cv01' 5">0水</span><span class="glyph-check glyph-check-5" style="font-feature-settings:'cv01' 6">0水</span><span class="glyph-check glyph-check-6" style="font-feature-settings:'cv01' 7">0水</span><span class="glyph-check glyph-check-7" style="font-feature-settings:'cv01' 8">0水</span><i class="face-pair face-pair-0" style="font-family:FeatureMetricPair0"></i><i class="face-pair face-pair-1" style="font-family:FeatureMetricPair1"></i><i class="face-pair face-pair-2" style="font-family:FeatureMetricPair2"></i><i class="face-pair face-pair-3" style="font-family:FeatureMetricPair3"></i><i class="face-pair face-pair-4" style="font-family:FeatureMetricPair4"></i><i class="face-pair face-pair-5" style="font-family:FeatureMetricPair5"></i><i class="face-pair face-pair-6" style="font-family:FeatureMetricPair6"></i><i class="face-pair face-pair-7" style="font-family:FeatureMetricPair7"></i>
<span class="dynamic-check" id="dynamic-var">0水</span>
<span class="dynamic-check" id="dynamic-round">0水</span>
</div>

<!doctype html>
<meta charset="utf-8">
<title>Two-axis view-timeline transport probe</title>
<style>
  @property --px { syntax: "<number>"; inherits: true; initial-value: -1; }
  @property --py { syntax: "<number>"; inherits: true; initial-value: -1; }
  @property --x { syntax: "<number>"; inherits: true; initial-value: -1; }
  @property --y { syntax: "<number>"; inherits: true; initial-value: -1; }
  @keyframes read-x { from { --px: 0 } to { --px: 1 } }
  @keyframes read-y { from { --py: 0 } to { --py: 1 } }
  .scope { timeline-scope: --tx, --ty; }
  .scroller {
    position: fixed;
    left: 0;
    top: -1000px;
    width: 100px;
    height: 100px;
    overflow: scroll;
  }
  .track { position: relative; width: 300px; height: 300px; }
  .subject {
    position: absolute;
    left: 0;
    top: 0;
    width: 37px;
    height: 41px;
    view-timeline-name: --tx, --ty;
    view-timeline-axis: inline, block;
  }
  #result {
    animation-name: read-x, read-y;
    animation-duration: 1s;
    animation-timing-function: linear;
    animation-fill-mode: both;
    animation-timeline: --tx, --ty;
    animation-range: cover;
    --x: calc(100 / var(--px) - 100);
    --y: calc(100 / var(--py) - 100);
  }
</style>
<div class="scope">
  <div class="scroller"><div class="track"><i class="subject"></i></div></div>
  <output id="result"></output>
</div>

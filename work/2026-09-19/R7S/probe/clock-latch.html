<!doctype html><meta charset="utf-8"><title>R7S clock-latch probe</title>
<style>
@property --clock{syntax:"<number>";inherits:true;initial-value:0}
@property --seed-override{syntax:"<number>";inherits:true;initial-value:0}
@property --seed{syntax:"<number>";inherits:true;initial-value:0}
@property --seed-t{syntax:"<number>";inherits:true;initial-value:0}
@property --seed-live{syntax:"<number>";inherits:true;initial-value:0}
@keyframes clock{from{--clock:0}to{--clock:64}}
.clock{animation:clock .97s linear infinite}
/* A: pause latch */
body:has(#run:checked) .clock{animation-play-state:paused}
.latch{--seed:calc(mod(round(down,var(--clock),1),64) + 1)}
/* B: 86400 s transition latch on a live (never paused) clock */
.clock2{animation:clock .97s linear infinite}
.latch-t{--seed-live:calc(mod(round(down,var(--clock),1),64) + 1);--seed-t:var(--seed-live)}
body:has(#run:checked) .latch-t{transition-property:--seed-t;transition-duration:1ms;transition-delay:86400s;transition-timing-function:steps(1,end)}
/* seed override via <select> */
body:has(#seed option[value="1"]:checked){--seed-override:1}body:has(#seed option[value="2"]:checked){--seed-override:2}body:has(#seed option[value="3"]:checked){--seed-override:3}body:has(#seed option[value="4"]:checked){--seed-override:4}body:has(#seed option[value="5"]:checked){--seed-override:5}body:has(#seed option[value="6"]:checked){--seed-override:6}body:has(#seed option[value="7"]:checked){--seed-override:7}body:has(#seed option[value="8"]:checked){--seed-override:8}body:has(#seed option[value="9"]:checked){--seed-override:9}body:has(#seed option[value="10"]:checked){--seed-override:10}body:has(#seed option[value="11"]:checked){--seed-override:11}body:has(#seed option[value="12"]:checked){--seed-override:12}body:has(#seed option[value="13"]:checked){--seed-override:13}body:has(#seed option[value="14"]:checked){--seed-override:14}body:has(#seed option[value="15"]:checked){--seed-override:15}body:has(#seed option[value="16"]:checked){--seed-override:16}body:has(#seed option[value="17"]:checked){--seed-override:17}body:has(#seed option[value="18"]:checked){--seed-override:18}body:has(#seed option[value="19"]:checked){--seed-override:19}body:has(#seed option[value="20"]:checked){--seed-override:20}body:has(#seed option[value="21"]:checked){--seed-override:21}body:has(#seed option[value="22"]:checked){--seed-override:22}body:has(#seed option[value="23"]:checked){--seed-override:23}body:has(#seed option[value="24"]:checked){--seed-override:24}body:has(#seed option[value="25"]:checked){--seed-override:25}body:has(#seed option[value="26"]:checked){--seed-override:26}body:has(#seed option[value="27"]:checked){--seed-override:27}body:has(#seed option[value="28"]:checked){--seed-override:28}body:has(#seed option[value="29"]:checked){--seed-override:29}body:has(#seed option[value="30"]:checked){--seed-override:30}body:has(#seed option[value="31"]:checked){--seed-override:31}body:has(#seed option[value="32"]:checked){--seed-override:32}body:has(#seed option[value="33"]:checked){--seed-override:33}body:has(#seed option[value="34"]:checked){--seed-override:34}body:has(#seed option[value="35"]:checked){--seed-override:35}body:has(#seed option[value="36"]:checked){--seed-override:36}body:has(#seed option[value="37"]:checked){--seed-override:37}body:has(#seed option[value="38"]:checked){--seed-override:38}body:has(#seed option[value="39"]:checked){--seed-override:39}body:has(#seed option[value="40"]:checked){--seed-override:40}body:has(#seed option[value="41"]:checked){--seed-override:41}body:has(#seed option[value="42"]:checked){--seed-override:42}body:has(#seed option[value="43"]:checked){--seed-override:43}body:has(#seed option[value="44"]:checked){--seed-override:44}body:has(#seed option[value="45"]:checked){--seed-override:45}body:has(#seed option[value="46"]:checked){--seed-override:46}body:has(#seed option[value="47"]:checked){--seed-override:47}body:has(#seed option[value="48"]:checked){--seed-override:48}body:has(#seed option[value="49"]:checked){--seed-override:49}body:has(#seed option[value="50"]:checked){--seed-override:50}body:has(#seed option[value="51"]:checked){--seed-override:51}body:has(#seed option[value="52"]:checked){--seed-override:52}body:has(#seed option[value="53"]:checked){--seed-override:53}body:has(#seed option[value="54"]:checked){--seed-override:54}body:has(#seed option[value="55"]:checked){--seed-override:55}body:has(#seed option[value="56"]:checked){--seed-override:56}body:has(#seed option[value="57"]:checked){--seed-override:57}body:has(#seed option[value="58"]:checked){--seed-override:58}body:has(#seed option[value="59"]:checked){--seed-override:59}body:has(#seed option[value="60"]:checked){--seed-override:60}body:has(#seed option[value="61"]:checked){--seed-override:61}body:has(#seed option[value="62"]:checked){--seed-override:62}body:has(#seed option[value="63"]:checked){--seed-override:63}body:has(#seed option[value="64"]:checked){--seed-override:64}
body:has(#seed option:not([value="0"]):checked) .latch{--seed:var(--seed-override)}
#out::after{counter-reset:seed var(--seed);content:"seed " counter(seed)}
#out-t::after{counter-reset:seedt var(--seed-t);content:"seed(T) " counter(seedt)}
</style>

<div class="clock"><div class="latch"><output id="out"></output></div></div>
<div class="clock2"><div class="latch-t"><output id="out-t"></output></div></div>
